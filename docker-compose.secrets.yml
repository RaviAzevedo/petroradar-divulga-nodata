# =============================================================================
# docker-compose.secrets.yml — OVERLAY OPT-IN de Docker secrets (G7 / WP09 §6.2)
# =============================================================================
# `env_file` expõe segredos como VARIÁVEIS DE AMBIENTE — visíveis em
# `docker inspect` e /proc/<pid>/environ. Este overlay move os segredos para
# Docker secrets file-based (tmpfs em /run/secrets/<nome>, 0400).
#
# USO (PRODUÇÃO — dev continua SEM este arquivo):
#   1. ./deploy/gen-secrets.sh                       # materializa deploy/secrets/* do .env.onprem
#   2. docker compose -f docker-compose.yml -f docker-compose.secrets.yml config -q
#   3. docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#   4. DEPOIS de validar: troque os valores dos segredos no .env.onprem por
#      placeholders (ver deploy/secrets/README.md) — os três guardados por
#      `${VAR:?}` no compose base (POSTGRES_PASSWORD, REDIS_PASSWORD,
#      MINIO_ROOT_PASSWORD) precisam de placeholder NÃO-vazio.
#
# COMO FUNCIONA por serviço:
#   • db / minio  : as imagens oficiais suportam *_FILE nativamente
#                   (POSTGRES_PASSWORD_FILE / MINIO_ROOT_PASSWORD_FILE).
#   • redis       : não suporta *_FILE -> o command lê o secret com $(cat ...)
#                   em runtime (o $$ escapa a interpolação do compose).
#   • web/bff/worker: as apps leem process.env/os.environ e NÃO suportam *_FILE
#                   -> entrypoint wrapper deploy/entrypoints/secrets-env.sh
#                   exporta VAR=$(cat $VAR_FILE) e exec o CMD original.
#                   ATENÇÃO: override de entrypoint LIMPA o CMD da imagem, por
#                   isso cada serviço redeclara o command original aqui.
#   • createbuckets (bootstrap one-shot) fica FORA: rode-o na provisão inicial,
#     ANTES de trocar os valores do .env.onprem por placeholders.
#
# Segurança pós-overlay: `docker inspect <svc>` mostra os segredos VAZIOS ("");
# o valor real existe apenas no environ do PROCESSO (dono/root) e no tmpfs.
# =============================================================================

secrets:
  auth_secret:           { file: ./deploy/secrets/auth_secret }
  cron_secret:           { file: ./deploy/secrets/cron_secret }
  setup_token:           { file: ./deploy/secrets/setup_token }
  postgres_password:     { file: ./deploy/secrets/postgres_password }
  database_url:          { file: ./deploy/secrets/database_url }
  redis_password:        { file: ./deploy/secrets/redis_password }
  redis_url:             { file: ./deploy/secrets/redis_url }
  celery_broker_url:     { file: ./deploy/secrets/celery_broker_url }
  celery_result_backend: { file: ./deploy/secrets/celery_result_backend }
  minio_root_password:   { file: ./deploy/secrets/minio_root_password }
  r2_secret_access_key:  { file: ./deploy/secrets/r2_secret_access_key }
  smtp_pass:             { file: ./deploy/secrets/smtp_pass }
  anthropic_api_key:     { file: ./deploy/secrets/anthropic_api_key }

services:
  # ── web (Next standalone; CMD original: node server.js) ─────────────────────
  web:
    entrypoint: ["/bin/sh", "/secrets-env.sh"]
    command: ["node", "server.js"]
    volumes:
      - ./deploy/entrypoints/secrets-env.sh:/secrets-env.sh:ro
    secrets:
      - auth_secret
      - cron_secret
      - setup_token
      - database_url
      - redis_url
      - r2_secret_access_key
      - smtp_pass
      - anthropic_api_key
    environment:
      # Zera o valor herdado do env_file (ambiente "limpo" no docker inspect);
      # o wrapper repõe a partir do arquivo em /run/secrets.
      AUTH_SECRET: ""
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      # NEXTAUTH_SECRET é por contrato o MESMO valor de AUTH_SECRET -> mesmo secret.
      NEXTAUTH_SECRET: ""
      NEXTAUTH_SECRET_FILE: /run/secrets/auth_secret
      CRON_SECRET: ""
      CRON_SECRET_FILE: /run/secrets/cron_secret
      SETUP_TOKEN: ""
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/redis_url
      R2_SECRET_ACCESS_KEY: ""
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
      SMTP_PASS: ""
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      # Vars compostas com senha que o web NÃO usa mas vêm do env_file:
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND: ""
      REDIS_PASSWORD: ""
      POSTGRES_PASSWORD: ""

  # ── bff (FastAPI; CMD original: sh -c uvicorn ...) ──────────────────────────
  bff:
    entrypoint: ["/bin/sh", "/secrets-env.sh"]
    # $$ = interpolação em RUNTIME (dentro do container), não pelo compose.
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${UVICORN_WORKERS:-2}"]
    volumes:
      - ./deploy/entrypoints/secrets-env.sh:/secrets-env.sh:ro
    secrets:
      - auth_secret
      - cron_secret
      - setup_token
      - database_url
      - redis_url
      - r2_secret_access_key
      - smtp_pass
      - anthropic_api_key
    environment:
      AUTH_SECRET: ""
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      NEXTAUTH_SECRET: ""
      NEXTAUTH_SECRET_FILE: /run/secrets/auth_secret
      CRON_SECRET: ""
      CRON_SECRET_FILE: /run/secrets/cron_secret
      SETUP_TOKEN: ""
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      # REDIS_URL cobre também a revogação (REDIS_REVOCATION_URL deriva dela).
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/redis_url
      # O compose base mapeia S3_SECRET_KEY: ${R2_SECRET_ACCESS_KEY:-} — repõe via file.
      S3_SECRET_KEY: ""
      S3_SECRET_KEY_FILE: /run/secrets/r2_secret_access_key
      R2_SECRET_ACCESS_KEY: ""
      SMTP_PASS: ""
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      CELERY_BROKER_URL: ""
      CELERY_RESULT_BACKEND: ""
      REDIS_PASSWORD: ""
      POSTGRES_PASSWORD: ""

  # ── worker (Celery; CMD original: bash start.sh) ────────────────────────────
  worker:
    entrypoint: ["/bin/sh", "/secrets-env.sh"]
    command: ["bash", "start.sh"]
    volumes:
      - ./deploy/entrypoints/secrets-env.sh:/secrets-env.sh:ro
    secrets:
      - cron_secret
      - database_url
      - redis_url
      - celery_broker_url
      - celery_result_backend
    environment:
      CRON_SECRET: ""
      CRON_SECRET_FILE: /run/secrets/cron_secret
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      # No compose base, worker.REDIS_URL/CELERY_BROKER_URL são compostos por
      # interpolação com ${REDIS_PASSWORD} — aqui viram file-based (db1).
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/redis_url
      CELERY_BROKER_URL: ""
      CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
      CELERY_RESULT_BACKEND: ""
      CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend
      # Vars com senha que o worker não lê (higiene do environ):
      AUTH_SECRET: ""
      NEXTAUTH_SECRET: ""
      SETUP_TOKEN: ""
      SMTP_PASS: ""
      ANTHROPIC_API_KEY: ""
      R2_SECRET_ACCESS_KEY: ""
      REDIS_PASSWORD: ""
      POSTGRES_PASSWORD: ""

  # ── db (imagem oficial postgres: suporta POSTGRES_PASSWORD_FILE nativo) ─────
  # POSTGRES_PASSWORD vazio + _FILE setado = OK (o entrypoint só reclama se os
  # DOIS forem não-vazios). Só é usado no PRIMEIRO initdb; depois é ignorado.
  db:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  # ── redis (sem suporte a *_FILE: lê o secret no command, em runtime) ────────
  redis:
    command: >
      sh -c 'exec redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --requirepass "$$(cat /run/secrets/redis_password)"'
    environment:
      REDIS_PASSWORD: ""
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    secrets:
      - redis_password

  # ── minio (suporta MINIO_ROOT_PASSWORD_FILE nativo) ─────────────────────────
  minio:
    environment:
      MINIO_ROOT_PASSWORD: ""
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_password
