# =============================================================================
# petro-radar-dev.conf — NGINX de DEV (http, sem TLS) para testar o ESTRANGULADOR
# localmente. Em produção, o NGINX dos servidores usa petro-radar.conf (443/TLS).
# O front passa a ser acessado via http://localhost:8080 (através do NGINX),
# que roteia: rotas migradas -> BFF (FastAPI); todo o resto -> Next.js.
# =============================================================================
upstream petro_web { server web:3000; }
upstream petro_bff { server bff:8000; }

server {
    listen 80;
    server_name localhost;
    client_max_body_size 52m;   # alinhado ao teto de upload do app (cofre 50MB)

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # Cabecalhos de seguranca + CSP (mesmo conjunto da prod; testado aqui em dev).
    include /etc/nginx/snippets/security-headers.conf;

    # Health do PROPRIO nginx (nao depende dos upstreams) — usado no healthcheck.
    location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # BFF exposto diretamente (health, futuras rotas /bff/*).
    location /bff/ {
        proxy_pass http://petro_bff;
    }

    # ── ROTAS MIGRADAS (estrangulador, Onda 1) ──────────────────────────────
    # Cada rota migrada e reescrita /api/<X> -> BFF /bff/api/<X> (mesma resposta).
    # O include abaixo e preenchido conforme as ondas avancam (parity-tested).
    include /etc/nginx/strangler/routes.conf;

    # ── Resto: paginas + /api nao migrado + _next/static + assets -> Next ────
    location / {
        proxy_pass http://petro_web;
    }
}
