# =============================================================================
# Petro Radar — NGINX server block (EXEMPLO p/ o NGINX ja existente nos servidores)
# =============================================================================
# Este arquivo NAO sobe no docker-compose. Copie para o NGINX do host:
#   /etc/nginx/conf.d/petro-radar.conf  (e ajuste certs/dominio).
#
# Os containers expoem-se em 127.0.0.1 (ver ports do compose). Se o NGINX rodar
# em outro host, troque 127.0.0.1 pelos IPs/hostnames dos containers ou use uma
# rede Docker compartilhada (external).
#
# Os security headers / CSP / HSTS sao emitidos pelo PROPRIO Next.js
# (next.config.ts headers()) — NAO duplicar aqui para evitar headers conflitantes.
# =============================================================================

# ---- Upstreams (containers do compose, publicados no loopback do host) -------
upstream petro_web {
    server 127.0.0.1:3000;
    keepalive 32;
}
upstream petro_bff {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate-limit de borda no LOGIN (defesa-em-profundidade; o BFF tb tem limite in-process).
# ~10 tentativas/min por IP, com burst curto. Zona no contexto http.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# ---- Redireciona HTTP -> HTTPS ----------------------------------------------
server {
    listen 80;
    server_name radar.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name radar.example.local;

    # ---- TLS (certs corporativos da Proponente) -------------------------------
    ssl_certificate     /etc/nginx/ssl/radar.example.local.crt;
    ssl_certificate_key /etc/nginx/ssl/radar.example.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # ---- Limites / correlacao -----------------------------------------------
    # Alinhado ao teto REAL de upload do app (cofre/participacoes validam 50MB):
    # com 12m, documentos de habilitacao de 12-50MB (certidoes/atestados
    # escaneados) tomavam 413 no NGINX ANTES da validacao do app (auditoria
    # 02/07/2026). 52m deixa a validacao do app ser o gate (erro limpo).
    client_max_body_size 52m;
    # Injeta um request id de correlacao (proxy.ts/loggerFor leem X-Request-Id).
    add_header X-Request-Id $request_id always;
    # HSTS na BORDA TLS (movido do next.config — la quebrava o acesso HTTP direto).
    # So faz sentido aqui, onde o NGINX serve HTTPS. (upgrade-insecure-requests nao
    # e necessario: a pagina ja e HTTPS e os assets sao URLs relativas.)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Demais cabeçalhos de segurança + CSP (no MESMO server{} que o HSTS).
    include /etc/nginx/snippets/security-headers.conf;

    # Headers de proxy comuns (reusados via include nos locations).
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    # Timeout de leitura do upstream. SEM ISTO vale o default do nginx (60s), e o
    # server{} de prod nao definia nada — so os locations /bff/ e /api/ tinham o
    # seu. Resultado: TODAS as rotas web-only longas (dossie, baixar-anexos,
    # anexos-zip, pacote-orcamento) herdavam 60s. E um timeout de INATIVIDADE:
    # essas rotas trabalham em silencio e so emitem bytes no fim, entao ele
    # disparava com certeza. O dossie (baixa anexos -> OCR -> Claude -> ZIP) leva
    # 1-2 min: dava 504 no usuario enquanto o container seguia gastando token, e
    # o reclique pagava tudo de novo. Nao aparecia em dev porque
    # petro-radar-dev.conf JA tem 300s no nivel do server — o bug so existia em
    # producao. Alinhado aqui com o dev.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # =========================================================================
    # /api/cron/* — DEFESA EM PROFUNDIDADE: so rede interna Proponente.
    # Alem do Bearer CRON_SECRET, restringe por IP de origem.
    # =========================================================================
    location /api/cron/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;        # ajuste para a faixa interna da Proponente
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://petro_web;
    }

    # =========================================================================
    # ESTRANGULADOR (strangler-fig): /bff/* e (gradualmente) /api/* -> FastAPI.
    # COMECE so com /bff/. A cada onda migrada, mova prefixos de /api/ para ca.
    # Ex. (Onda 1): location ~ ^/api/(resultados|users)/ { ... bff }
    # =========================================================================
    location /bff/ {
        proxy_pass http://petro_bff;
        proxy_read_timeout    300s;   # IA/analise podem demorar (maxDuration 300)
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # /metrics (Prometheus do BFF) NUNCA pela borda publica — so scrape na rede
    # interna. Defesa em profundidade: mesmo que um proxy amplo seja adicionado
    # no futuro, a borda bloqueia. O Prometheus raspa bff:8000/metrics direto.
    location = /metrics { deny all; return 404; }

    # =========================================================================
    # ESTRANGULADOR — FLIP: /api/* -> BFF, EXCETO auth (NextAuth) e 3 rotas xlsx
    # (bytes exceljs!=openpyxl). Espelha nginx/strangler/routes.conf (validado em
    # dev: smoke 142/142, parity). /api/cron/ ja foi tratado acima (-> Next).
    # =========================================================================
    # NextAuth (emite o token) + qualquer /api/auth* permanece no Next.
    location ^~ /api/auth {
        # Rate-limit de borda no callback de login (burst 5, sem fila no estouro).
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://petro_web;
    }
    # Rotas que geram xlsx (openpyxl no BFF != exceljs no Next) ficam no Next.
    # Planilha do Explorar (ExcelJS) -> Next. Exata: /api/licitacoes/export (csv/
    # json) continua no BFF; so a /xlsx e web-only.
    location = /api/licitacoes/export/xlsx           { proxy_pass http://petro_web; }
    # Relatorios do acervo: /api/relatorios/* sao web-only (exceljs/pdf-lib).
    location ^~ /api/relatorios/                     { proxy_pass http://petro_web; }
    location = /api/conformidade/import/template/familias { proxy_pass http://petro_web; }
    location ~ ^/api/licitacoes/[^/]+/pacote-orcamento$   { proxy_pass http://petro_web; }
    # Briefing PDF (pdf-lib no Next; o BFF nao embarca gerador de PDF) -> Next.
    location ~ ^/api/licitacoes/[^/]+/briefing$          { proxy_pass http://petro_web; }
    # Produtor de texto dos anexos (unpdf + download na fonte, libs TS) -> Next.
    location ~ ^/api/licitacoes/[^/]+/baixar-anexos$     { proxy_pass http://petro_web; }
    # Baixar tudo (ZIP): JSZip + download na fonte (anexos), so no Next.
    location ~ ^/api/licitacoes/[^/]+/anexos-zip$      { proxy_pass http://petro_web; }
    # Dossie (O BOTAO): baixa anexos -> analisa no Claude -> devolve ZIP com
    # briefing PDF + CHECK-LIST oficial + documentos. E o unico caminho do
    # produto que gasta token. Usa pdf-lib + exceljs + JSZip -> so no Next.
    #
    # Timeout explicito (redundante com o do server{}, de proposito): esta e a
    # unica rota do produto que QUEIMA DINHEIRO se o proxy desistir no meio — o
    # Node segue rodando e faturando a chamada ao Claude num socket morto. Deixar
    # o numero visivel aqui e mais barato que redescobrir isso num 504.
    location ~ ^/api/licitacoes/[^/]+/dossie$ {
        proxy_pass http://petro_web;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Admin Center SSO (2026-07): gestao de usuarios evoluiu no Next (pendente/
    # aprovar/entra_oid/revogar-sessoes/hard-delete) e a busca no diretorio
    # Microsoft (Graph) so existe no Next -> web-only (espelho BFF defasado).
    location ^~ /api/admin/users { proxy_pass http://petro_web; }
    location ^~ /api/admin/entra { proxy_pass http://petro_web; }
    # Painel de e-mails do digest (0026): filtros/assinaturas so existem no
    # Next (Graph sendMail) -> web-only.
    location ^~ /api/admin/emails { proxy_pass http://petro_web; }
    # Preferencias de e-mail do PROPRIO usuario (0029) — sem espelho no BFF.
    location = /api/preferencias-email { proxy_pass http://petro_web; }
    # Disciplina e profissional do acervo (0043, onda 4): so existem no Next
    # (Drizzle) - sem espelho BFF por ora (divida registrada na spec ONDA-4 secao 10).
    # ^~ cobre /disciplinas, /disciplinas/cobertura, /profissionais e /profissionais/<id>.
    location ^~ /api/conformidade/disciplinas   { proxy_pass http://petro_web; }
    location ^~ /api/conformidade/profissionais { proxy_pass http://petro_web; }
    # As tres abaixo sao sufixos de prefixos que PERTENCEM ao BFF (operacoes e
    # cofre/documentos) - por isso regex, nunca ^~: desviar o prefixo inteiro
    # tiraria do BFF as rotas que ele ja atende.
    location ~ ^/api/conformidade/operacoes/[^/]+/disciplinas$          { proxy_pass http://petro_web; }
    location ~ ^/api/conformidade/cofre/documentos/[^/]+/profissionais$ { proxy_pass http://petro_web; }
    location ~ ^/api/conformidade/cofre/documentos/[^/]+/atividades$    { proxy_pass http://petro_web; }
    # Anotacoes e itens tagueados do acervo (0044, onda 5): so existem no Next
    # (Drizzle) - sem espelho BFF por ora (divida registrada na spec ONDA-5).
    # ^~ cobre /anotacoes e /anotacoes/<id>.
    location ^~ /api/conformidade/anotacoes { proxy_pass http://petro_web; }
    # Sufixo de um prefixo que PERTENCE ao BFF (cofre/documentos) - por isso regex,
    # nunca ^~: desviar o prefixo inteiro tiraria do BFF as rotas que ele ja atende.
    location ~ ^/api/conformidade/cofre/documentos/[^/]+/itens$ { proxy_pass http://petro_web; }
    # Todo o restante de /api/ -> BFF (142 rotas migradas e verificadas).
    location /api/ {
        proxy_pass http://petro_bff;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # =========================================================================
    # /_next/static/* — assets imutaveis com hash. Cache longo no browser.
    # O server.js do standalone ja serve esses arquivos; aqui so adicionamos
    # o header de cache agressivo (1 ano, immutable).
    # =========================================================================
    location /_next/static/ {
        proxy_pass http://petro_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # =========================================================================
    # /sw.js (despedida: se desregistra; o push saiu em 2026-09) e o manifest —
    # NAO cachear no NGINX. O Next ja seta
    # Cache-Control no-store e Service-Worker-Allowed:/ — apenas repassar.
    # =========================================================================
    location = /sw.js {
        proxy_pass http://petro_web;
        proxy_hide_header Cache-Control;            # deixa o Next mandar o dele
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /manifest.webmanifest {
        proxy_pass http://petro_web;
    }

    # =========================================================================
    # Tudo o mais (UI / RSC / paginas) -> Next.js.
    # =========================================================================
    location / {
        proxy_pass http://petro_web;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        # WebSocket/HMR (irrelevante em prod, mas inofensivo):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
