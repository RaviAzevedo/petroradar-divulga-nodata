# nginx/snippets/security-headers.conf  (incluído DENTRO do server{})
# O APP (Next) já emite o conjunto completo de cabeçalhos de segurança + CSP
# (X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy,
# Content-Security-Policy) via next.config — eles passam pelo proxy. Por isso NÃO
# duplicamos add_header aqui (dois CSP => interseção, confuso). No edge fazemos
# apenas o que o app NÃO faz: ocultar a versão do nginx. (HSTS fica no server 443.)
server_tokens off;
