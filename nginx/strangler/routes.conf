# =============================================================================
# routes.conf - ESTRANGULADOR (FLIP FINAL).
# Todo /api/ -> BFF (FastAPI), exceto:
#   - /api/auth*  -> Next (NextAuth e o emissor do token; o BFF so valida).
#   - 3 rotas xlsx -> Next (bytes exceljs != openpyxl; mantem identidade binaria).
# 142 pares (method,path) migrados e verificados por paridade + smoke.
# Incluido no server{} de petro-radar-dev.conf. ASCII-only (acentos quebram o parser).
# =============================================================================

# NextAuth + qualquer /api/auth* permanece no Next.
location ^~ /api/auth {
    proxy_pass http://petro_web;
}

# Rotas que geram xlsx (openpyxl no BFF != exceljs no Next) ficam no Next.
# Planilha do Explorar (ExcelJS) -> Next. So a /xlsx e web-only; a /export
# (csv/json) segue no BFF.
location = /api/licitacoes/export/xlsx { proxy_pass http://web:3000; }

# Relatorios do acervo: /api/relatorios/* (curriculo-rt)
# sao web-only (exceljs/pdf-lib). Prefixo ^~ cobre o slug dinamico [tipo]. (O hub
# com os 8 relatorios gerenciais saiu na limpeza de 2026-09-18.)
location ^~ /api/relatorios/ {
    proxy_pass http://petro_web;
}
location = /api/conformidade/import/template/familias {
    proxy_pass http://petro_web;
}
location ~ ^/api/licitacoes/[^/]+/pacote-orcamento$ {
    proxy_pass http://petro_web;
}
# Briefing PDF (pdf-lib no Next; o BFF nao embarca gerador de PDF) -> Next.
location ~ ^/api/licitacoes/[^/]+/briefing$ {
    proxy_pass http://petro_web;
}
# Produtor de texto dos anexos (unpdf + download na fonte, libs TS) -> Next.
location ~ ^/api/licitacoes/[^/]+/baixar-anexos$ {
    proxy_pass http://petro_web;
}
# Baixar tudo (ZIP): JSZip + download na fonte (anexos), so no Next.
location ~ ^/api/licitacoes/[^/]+/anexos-zip$ {
    proxy_pass http://petro_web;
}
# Dossie (O BOTAO): baixa anexos -> analisa no Claude -> devolve ZIP com briefing
# PDF + CHECK-LIST oficial + documentos. Unico caminho do produto que gasta token.
# Usa pdf-lib + exceljs + JSZip -> so no Next.
#
# Timeout explicito: o pipeline leva 1-2 min e so emite bytes no fim, entao o
# default de 60s do nginx (timeout de INATIVIDADE) estourava com certeza — 504 no
# usuario com o Node seguindo o gasto. Ver o comentario gemeo em
# nginx/conf.d/petro-radar.conf.
location ~ ^/api/licitacoes/[^/]+/dossie$ {
    proxy_pass http://petro_web;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Admin Center SSO (2026-07): gestao de usuarios evoluiu no Next (pendente/
# aprovar/entra_oid/revogar-sessoes/hard-delete) e a busca no diretorio
# Microsoft (Graph) so existe no Next -> web-only; o espelho BFF antigo de
# admin/users ficou DEFASADO (nao usar ate re-espelhar).
location ^~ /api/admin/users {
    proxy_pass http://petro_web;
}
location ^~ /api/admin/entra {
    proxy_pass http://petro_web;
}
# Painel de e-mails do digest (0026): filtros/assinaturas so existem no Next
# (Graph sendMail) -> web-only.
location ^~ /api/admin/emails {
    proxy_pass http://petro_web;
}
# Preferencias de e-mail do proprio usuario: so existe no Next -> web-only.
location = /api/preferencias-email {
    proxy_pass http://petro_web;
}

# Disciplina e profissional do acervo (0043, onda 4): so existem no Next
# (Drizzle) - sem espelho BFF por ora (divida registrada na spec ONDA-4 secao 10).
# ^~ cobre /disciplinas, /disciplinas/cobertura, /profissionais e /profissionais/<id>.
location ^~ /api/conformidade/disciplinas   { proxy_pass http://petro_web; }
location ^~ /api/conformidade/profissionais { proxy_pass http://petro_web; }
# As tres abaixo sao sufixos de prefixos que PERTENCEM ao BFF (operacoes e
# cofre/documentos) - por isso regex, nunca ^~: desviar o prefixo inteiro
# tiraria do BFF as rotas que ele ja atende.
location ~ ^/api/conformidade/operacoes/[^/]+/disciplinas$          { proxy_pass http://petro_web; }
location ~ ^/api/conformidade/cofre/documentos/[^/]+/profissionais$ { proxy_pass http://petro_web; }
location ~ ^/api/conformidade/cofre/documentos/[^/]+/atividades$    { proxy_pass http://petro_web; }
# Anotacoes e itens tagueados do acervo (0044, onda 5): so existem no Next
# (Drizzle) - sem espelho BFF por ora (divida registrada na spec ONDA-5).
# ^~ cobre /anotacoes e /anotacoes/<id>.
location ^~ /api/conformidade/anotacoes { proxy_pass http://petro_web; }
# Sufixo de um prefixo que PERTENCE ao BFF (cofre/documentos) - por isso regex,
# nunca ^~: desviar o prefixo inteiro tiraria do BFF as rotas que ele ja atende.
location ~ ^/api/conformidade/cofre/documentos/[^/]+/itens$ { proxy_pass http://petro_web; }

# Todo o restante de /api/ -> BFF.
location /api/ {
    proxy_pass http://petro_bff;
}
