# =============================================================================
# observability/blackbox/blackbox.yml — módulos de probe HTTP (healthchecks
# agregados). Alvos definidos em observability/prometheus/prometheus.yml.
# =============================================================================
modules:
  # 2xx estrito: bff /bff/health, worker :8080/healthz, minio /minio/health/live.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false

  # "Vivo": aceita 200 E 503 — qualquer resposta = server de pé (mesma
  # semântica do healthcheck do compose principal).
  http_alive:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200, 503]
      preferred_ip_protocol: ip4
      fail_if_not_ssl: false
