[pytest]
# Modo asyncio automático: testes `async def` rodam sem precisar de @pytest.mark.asyncio.
asyncio_mode = auto
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    live: teste que exige o container bff no ar (defina BFF_BASE_URL).
